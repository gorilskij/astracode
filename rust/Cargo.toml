[workspace]
resolver = "2"
members = ["astracode", "astracode-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Keep symbols so that profilers (samply, Instruments, perf) can name functions.
debug = "line-tables-only"

[profile.dev]
# The scanner is numeric code; unoptimised it is too slow even for tests.
opt-level = 2
