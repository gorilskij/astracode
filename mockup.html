<!doctype html>
<meta charset="utf-8">
<title>Astracode mockup</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 24px; background: #f2f2f2; color: #111; display: flex; gap: 32px; flex-wrap: wrap; }
  #controls { width: 300px; display: grid; gap: 12px; align-content: start; }
  label { display: grid; gap: 4px; }
  label span { display: flex; justify-content: space-between; }
  input[type=range], input[type=text] { width: 100%; box-sizing: border-box; }
  input[type=text] { font: 16px ui-monospace, monospace; padding: 4px 6px; }
  .row { display: flex; gap: 8px; align-items: center; }
  #previews { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
  #small { display: grid; gap: 16px; }
  #nibbles { font: 12px ui-monospace, monospace; color: #555; word-break: break-all; }
</style>

<div id="controls">
  <label><span>12-digit number</span><input type="text" id="num" maxlength="12" value="123456789012"></label>
  <div class="row">
    <button id="rand">Random</button>
    <button id="full">All solid</button>
    <button id="empty">All light</button>
  </div>
  <label><span>Star size (outer radius) <b id="vStar"></b></span><input type="range" id="star" min="8" max="26" step="0.5" value="19.5"></label>
  <label><span>Logo crop circle diameter <b id="vLogo"></b></span><input type="range" id="logo" min="80" max="280" step="1" value="180"></label>
  <label><span>Margin around ring <b id="vPad"></b></span><input type="range" id="pad" min="0" max="40" step="1" value="16"></label>
  <div class="row">
    <label>Ink <input type="color" id="fg" value="#021639"></label>
    <label>Background <input type="color" id="bg" value="#febc5c"></label>
    <button id="swap">Swap</button>
  </div>
  <div id="nibbles"></div>
  <div style="color:#555">Ring radius is fixed at 100; all sizes are relative to it. The scanner expects the defaults (star 19.5, logo 180); other values are for looking only. Every star is a full pentagram: each limb is solid or 70% ink, the centre is always solid. Stars 9 to 12 are check symbols.</div>
</div>

<div id="previews">
  <div id="big"></div>
  <div id="small"></div>
</div>

<script>
const LOGO = `<path d="M338.37,465.61c23-62.6,49.94-122.56,81.41-172.56,19.82,31.52,37.88,67,54.29,104.62a1242.84,1242.84,0,0,1,128.34-46.05C485.58,134.07,419.78,91.42,419.78,91.42s-78.92,51.16-217.27,327C169,485.21,134,563.55,99.17,654.68,152.15,594.63,228.47,529.46,338.37,465.61Z"/><path d="M590.17,543.37c-16.66,11.13-34.06,23.38-51.87,36.74,49.12,170.74,70.06,328.47,70.06,328.47H825.5C776.38,741,723.47,603.64,672.6,492.63,646.63,507.34,618.78,524.25,590.17,543.37Z"/><path d="M982.17,298.05l-98-5.3-38.63-90.22a4,4,0,0,0-7.39.13l-35.32,91.58-97.75,8.86a4,4,0,0,0-2.16,7.07l51.57,41.89a1245.36,1245.36,0,0,0-135.25,31.47,1205.4,1205.4,0,0,0-131.61,46.65A1107.27,1107.27,0,0,0,384.41,480q-34.05,18.71-64,37.47c-149,93.34-225.58,186.86-264.91,259-42.9,78.78-41.47,132.11-41.47,132.11H231.19c58.29-158.17,179.5-278.94,296.43-364.38a1326.91,1326.91,0,0,1,130-83.58c46.2-26.07,86.34-45.26,114.42-57.74l-14.77,64.88a4,4,0,0,0,6.06,4.24l82.4-53.33L930.06,469a4,4,0,0,0,5.9-4.46l-25.25-94.84L984.58,305A4,4,0,0,0,982.17,298.05Z"/>`;
// Placement from the source file: a 3840 square whose centre is the code's centre. Not re-centred.
const LOGO_SRC = 3840, LOGO_TF = 'translate(744.90 729.60) scale(2.671645) translate(-14.05 -91.42)';
const R = 100;
const RATIO = Math.sin(Math.PI / 10) / Math.sin(3 * Math.PI / 10); // regular pentagram
const $ = id => document.getElementById(id);
let override = null; // null | 15 | 0

const SHADE = 0.7;   // ink fraction of a light limb
const P = (cx, cy, r, deg) => {
  const a = deg * Math.PI / 180;
  return (cx + r * Math.cos(a)).toFixed(3) + ',' + (cy + r * Math.sin(a)).toFixed(3);
};
// Bit 4 of a star's symbol is the top limb, then clockwise bits 3..0. 1 = solid, 0 = light.
const limbSolid = (symbol, k) => (symbol >> (4 - k)) & 1;

// The solid part of a star: centre pentagon plus its solid limbs.
function solidPart(cx, cy, ro, symbol) {
  const pts = [];
  for (let k = 0; k < 5; k++) {
    pts.push(P(cx, cy, ro * RATIO, -90 - 36 + 72 * k));
    if (limbSolid(symbol, k)) pts.push(P(cx, cy, ro, -90 + 72 * k));
  }
  return `<polygon points="${pts.join(' ')}"/>`;
}

// One limb, closed through the star centre so it tucks under the solid centre without a seam.
function limb(cx, cy, ro, k) {
  const pts = [P(cx, cy, ro * RATIO, -90 - 36 + 72 * k), P(cx, cy, ro, -90 + 72 * k),
               P(cx, cy, ro * RATIO, -90 + 36 + 72 * k), P(cx, cy, 0, 0)];
  return `<polygon points="${pts.join(' ')}"/>`;
}

const mix = (bg, ink, t) => '#' + [1, 3, 5].map(i => {
  const a = parseInt(bg.slice(i, i + 2), 16), b = parseInt(ink.slice(i, i + 2), 16);
  return Math.round(a + (b - a) * t).toString(16).padStart(2, '0');
}).join('');

// --- payload encoding; must match astracode/spec.py ---
const MASK = [0x15, 0x0A, 0x13, 0x1C, 0x09, 0x06, 0x1E, 0x01, 0x17, 0x08, 0x1B, 0x04];
const GF_EXP = [], GF_LOG = [];
for (let i = 0, x = 1; i < 31; i++) { GF_EXP[i] = GF_EXP[i + 31] = x; GF_LOG[x] = i; x <<= 1; if (x & 32) x ^= 0x25; }
const gfMul = (a, b) => (a && b) ? GF_EXP[GF_LOG[a] + GF_LOG[b]] : 0;
// Generator polynomial with roots a^0..a^3, highest degree first.
let GEN = [1];
for (let j = 0; j < 4; j++) GEN = [...GEN, 0].map((x, i) => x ^ gfMul(i ? GEN[i - 1] : 0, GF_EXP[j]));

// Number -> the 12 symbols as drawn: 8 data symbols (5 bits each), 4 Reed-Solomon check symbols, masked.
function encode(numStr) {
  let n = BigInt(numStr || '0');
  const data = [];
  for (let i = 0; i < 8; i++) { data.unshift(Number(n & 31n)); n >>= 5n; }
  let rem = [0, 0, 0, 0];
  for (const d of data) {
    const f = d ^ rem[0];
    rem = [rem[1], rem[2], rem[3], 0].map((r, i) => r ^ gfMul(f, GEN[i + 1]));
  }
  return [...data, ...rem].map((c, i) => c ^ MASK[i]);
}
// --- end payload encoding ---

function render() {
  const ro = +$('star').value, lh = +$('logo').value, pad = +$('pad').value, fg = $('fg').value, bg = $('bg').value;
  $('vStar').textContent = ro; $('vLogo').textContent = lh; $('vPad').textContent = pad;
  const num = $('num').value.replace(/\D/g, '');
  const nib = override === null ? encode(num) : Array(12).fill(override);
  $('nibbles').textContent = 'symbols: ' + nib.map(x => x.toString(32)).join(' ');

  let stars = '', light = '';
  for (let i = 0; i < 12; i++) {
    const a = (-90 + 30 * i) * Math.PI / 180, cx = R * Math.cos(a), cy = R * Math.sin(a);
    for (let k = 0; k < 5; k++) if (!limbSolid(nib[i], k)) light += limb(cx, cy, ro, k);
    stars += solidPart(cx, cy, ro, nib[i]);
  }
  const half = R + ro + pad, k = lh / LOGO_SRC;
  const svg = size => `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="${-half} ${-half} ${2 * half} ${2 * half}">
    <rect x="${-half}" y="${-half}" width="${2 * half}" height="${2 * half}" fill="${bg}"/>
    <g fill="${mix(bg, fg, SHADE)}">${light}</g>
    <g fill="${fg}">${stars}
      <g transform="scale(${k}) translate(${-LOGO_SRC / 2} ${-LOGO_SRC / 2}) ${LOGO_TF}">${LOGO}</g>
    </g></svg>`;
  $('big').innerHTML = svg(560);
  $('small').innerHTML = svg(160) + svg(80) + svg(40);
}

for (const el of document.querySelectorAll('input')) el.addEventListener('input', () => { if (el.id === 'num') override = null; render(); });
$('rand').onclick = () => { override = null; $('num').value = String(Math.floor(Math.random() * 1e12)).padStart(12, '0'); render(); };
$('full').onclick = () => { override = 31; render(); };
$('empty').onclick = () => { override = 0; render(); };
$('swap').onclick = () => { const t = $('fg').value; $('fg').value = $('bg').value; $('bg').value = t; render(); };
render();
</script>
